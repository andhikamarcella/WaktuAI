<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="WaktuAI: jadwal sholat, reminder, notifikasi, suara, kiblat, dan hitung rakaat." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <title>WaktuAI</title>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen">
        <section>
          <span>WaktuAI</span>
          <h1>Memuat asisten sholat</h1>
          <p>Jika halaman berhenti di sini, refresh sekali untuk mengambil versi terbaru aplikasi.</p>
        </section>
      </main>
    </div>
    <style>
      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, system-ui, sans-serif;
        background: radial-gradient(circle at top left, rgba(15, 118, 110, 0.14), transparent 340px), #f8fafc;
        color: #0f172a;
      }
      .boot-screen section {
        width: min(520px, 100%);
        border: 1px solid #dbe7e3;
        border-radius: 18px;
        background: #ffffff;
        padding: 24px;
        box-shadow: 0 20px 70px rgba(15, 23, 42, 0.12);
      }
      .boot-screen span {
        color: #0f766e;
        font-weight: 800;
        text-transform: uppercase;
        font-size: 12px;
      }
      .boot-screen h1 {
        margin: 8px 0;
        font-size: 32px;
        line-height: 1.05;
      }
      .boot-screen p {
        margin: 0;
        color: #475569;
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
